<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Re-Order — WoordWise</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/warmup.css">
    <link rel="stylesheet" href="styles/reorder.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Theme colour for the browser chrome -->
    <meta name="theme-color" content="#E1D4FF">

    <!-- iOS-specific -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WoordWise">

    <!-- Favicon (reuses your 192 icon) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>

<body data-page="game" data-llm="off">

    <main class="reorder">
        <header class="reorder-head">
            <div class="reorder-progress" id="progress" aria-hidden="true"></div>
            <div class="reorder-score" aria-label="Score">
                <span class="reorder-score-ok">&#10003;&nbsp;<b id="score-ok">0</b></span>
                <span class="reorder-score-bad">&#10007;&nbsp;<b id="score-bad">0</b></span>
            </div>
        </header>

        <section class="reorder-stage">
            <div class="reorder-card" id="card">

                <div class="reorder-loading" id="loading" hidden>
                    <div class="reorder-loading-dots" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </div>
                    <p class="reorder-loading-text" id="loading-text">Contacting the AI&hellip;</p>
                </div>

                <div class="reorder-content" id="content" hidden>
                    <p class="reorder-instruction">
                        Tap one word, then tap another to swap them.
                    </p>

                    <div class="reorder-cards" id="cards"></div>

                    <div class="reorder-english" id="english-always" hidden></div>

                    <div class="reorder-hints" id="hints">
                        <button type="button" class="reorder-hint-btn" id="grammar-btn">
                            Show grammar hint
                        </button>
                    </div>

                    <div class="reorder-reveals">
                        <div class="reorder-reveal reorder-reveal-grammar" id="grammar-reveal" hidden></div>
                        <div class="reorder-reveal reorder-reveal-en" id="english-reveal" hidden></div>
                    </div>

                    <div class="reorder-result" id="result" hidden>
                        <div class="reorder-result-header">
                            <span class="reorder-result-icon" id="result-icon"></span>
                            <span class="reorder-result-msg" id="result-msg"></span>
                        </div>
                        <div class="reorder-result-correct" id="result-correct"></div>
                        <div class="reorder-result-explain" id="result-explain"></div>
                    </div>
                </div>

                <div class="reorder-error" id="error" hidden>
                    <p class="reorder-error-msg" id="error-msg"></p>
                    <div class="reorder-error-actions">
                        <button type="button" class="yellow-button" id="btn-retry">Retry</button>
                        <button type="button" class="btn" id="btn-settings">AI settings</button>
                    </div>
                </div>
            </div>

            <div class="reorder-actions" id="actions" hidden>
                <button type="button" class="reorder-check" id="btn-check">Check</button>
            </div>
        </section>

        <p class="reorder-foot-hint">
            Put the words in the correct Dutch order.
        </p>
    </main>

    <section class="reorder-end" id="end-screen" hidden role="dialog" aria-modal="true" aria-labelledby="end-title">
        <div class="reorder-end-inner">
            <h2 id="end-title">Session complete</h2>
            <p class="reorder-end-score" id="end-score">0 / 10</p>
            <p class="reorder-end-breakdown" id="end-breakdown"></p>
            <p class="reorder-end-msg" id="end-msg"></p>
            <div class="reorder-end-actions">
                <button type="button" class="yellow-button" id="btn-again">Play again</button>
                <a class="btn" href="index.html">&larr; Home</a>
            </div>
        </div>
    </section>

    <div id="author">
        Made with &hearts; for Dutch learners by
        <a href="https://linkedin.com/in/kushrupani" target="_blank">
            Kaushal Rupani
        </a>
    </div>

    <script src="scripts/base.js"></script>
    <script src="scripts/feedback.js"></script>
    <script src="scripts/online.js"></script>
    <script src="scripts/warmup.js"></script>
    <script src="scripts/effects.js"></script>
    <script src="scripts/reorder.js"></script>
    <script src="scripts/cache.js"></script>
</body>

</html>
