<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Niet / Geen — WoordWise</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/nietgeen.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Theme colour for the browser chrome -->
    <meta name="theme-color" content="#E1D4FF">

    <!-- iOS-specific -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WoordWise">

    <!-- Favicon (reuses your 192 icon) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>

<body data-page="game" data-llm="off">

    <main class="nietgeen">
        <header class="nietgeen-head">
            <div class="nietgeen-progress" id="progress" aria-hidden="true"></div>
            <div class="nietgeen-score" aria-label="Score">
                <span class="nietgeen-score-ok">&#10003;&nbsp;<b id="score-ok">0</b></span>
                <span class="nietgeen-score-bad">&#10007;&nbsp;<b id="score-bad">0</b></span>
            </div>
        </header>

        <section class="nietgeen-stage">
            <div class="nietgeen-card" id="card">

                <div class="nietgeen-loading" id="loading" hidden>
                    <div class="nietgeen-loading-dots" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </div>
                    <p class="nietgeen-loading-text" id="loading-text">Generating A2 sentences&hellip;</p>
                </div>

                <div class="nietgeen-content" id="content" hidden>
                    <div class="nietgeen-sentence" id="sentence"></div>
                    <div class="nietgeen-below">
                        <button type="button" class="nietgeen-reveal" id="reveal-btn">
                            Reveal English hint
                        </button>
                        <div class="nietgeen-translation" id="translation" hidden></div>
                    </div>
                </div>

                <div class="nietgeen-feedback" id="feedback" hidden>
                    <div class="nietgeen-fb-row">
                        <span class="nietgeen-fb-icon" id="fb-icon"></span>
                        <span class="nietgeen-fb-msg" id="fb-msg"></span>
                    </div>
                    <div class="nietgeen-fb-explain" id="fb-explain"></div>
                </div>

                <div class="nietgeen-error" id="error" hidden>
                    <p class="nietgeen-error-msg" id="error-msg"></p>
                    <div class="nietgeen-error-actions">
                        <button type="button" class="yellow-button" id="btn-retry">Retry</button>
                        <button type="button" class="btn" id="btn-settings">Gemini settings</button>
                    </div>
                </div>
            </div>

            <div class="nietgeen-actions" id="actions" hidden>
                <button type="button" class="nietgeen-btn nietgeen-btn-niet" id="btn-niet" aria-label="Choose niet">
                    NIET
                </button>
                <button type="button" class="nietgeen-btn nietgeen-btn-geen" id="btn-geen" aria-label="Choose geen">
                    GEEN
                </button>
            </div>
        </section>

        <p class="nietgeen-hint">
            Fill the blank with <b>niet</b> or <b>geen</b>.
        </p>
    </main>

    <section class="nietgeen-end" id="end-screen" hidden role="dialog" aria-modal="true" aria-labelledby="end-title">
        <div class="nietgeen-end-inner">
            <h2 id="end-title">Session complete</h2>
            <p class="nietgeen-end-score" id="end-score">0 / 10</p>
            <p class="nietgeen-end-breakdown" id="end-breakdown"></p>
            <p class="nietgeen-end-msg" id="end-msg"></p>
            <div class="nietgeen-end-actions">
                <button type="button" class="yellow-button" id="btn-again">Play again</button>
                <a class="btn" href="index.html">&larr; Home</a>
            </div>
        </div>
    </section>

    <div id="author">
        Made with &hearts; for Dutch learners by
        <a href="https://linkedin.com/in/kushrupani" target="_blank">
            Kaushal Rupani
        </a>
    </div>

    <script src="scripts/base.js"></script>
    <script src="scripts/feedback.js"></script>
    <script src="scripts/online.js"></script>
    <script src="scripts/effects.js"></script>
    <script src="scripts/nietgeen.js"></script>
    <script src="scripts/cache.js"></script>
</body>

</html>
